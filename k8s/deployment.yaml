apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-html-deployment
  namespace: pavizhan
  labels:
    app: my-html-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-html-app
  template:
    metadata:
      labels:
        app: my-html-app
    spec:
      containers:
      - name: html-app
        image: pzacregistry.azurecr.io/my-html-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80