trigger:
  branches:
    include:
      - main

pool:
  name: 'Default'

variables:
  # Replace with your actual Azure Container Registry name
  acrName: 'pzacregistry'
  imageName: 'my-html-app'

stages:
- stage: Containerize
  displayName: 'Build Container via ACR'
  jobs:
  - job: ACRBuild
    displayName: 'Cloud Build and Push to ACR'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Trigger az acr build'
      inputs:
        azureSubscription: 'azure-connection'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Triggering cloud build on ACR: $(acrName)..."
          az acr build --registry $(acrName) --image $(imageName):$(Build.BuildId) --image $(imageName):latest .