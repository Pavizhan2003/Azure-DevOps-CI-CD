trigger:
  branches:
    include:
      - main

pool:
  name: 'Default'

variables:
  acrName: 'pzacregistry'
  imageName: 'my-html-app'
  # Update these two variables to match your AKS cluster details:
  aksClusterName: 'AKS-learnings-cluster'
  aksResourceGroup: 'AKS-learning'

stages:
# -------------------------------------------------------------
# STAGE 1: Continuous Integration (Cloud Build to ACR)
# -------------------------------------------------------------
- stage: Build
  displayName: 'Build & Push to ACR'
  jobs:
  - job: ACRBuild
    displayName: 'Cloud Build via ACR Tasks'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Trigger az acr build'
      inputs:
        azureSubscription: 'azure-connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Triggering cloud build on ACR: $(acrName)..."
          az acr build --registry $(acrName) --image $(imageName):$(Build.BuildId) --image $(imageName):latest .

# -------------------------------------------------------------
# STAGE 2: Continuous Deployment (Rollout to AKS)
# -------------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployToAKS
    displayName: 'Apply Manifests to Cluster'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Get AKS Credentials & Deploy'
      inputs:
        azureSubscription: 'azure-connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Authenticating to AKS via local admin credentials..."
          az aks get-credentials --resource-group $(aksResourceGroup) --name $(aksClusterName) --admin --overwrite-existing

          Write-Host "Deploying manifests to namespace pavizhan..."
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

          Write-Host "Triggering rolling restart..."
          kubectl rollout restart deployment/my-html-deployment -n pavizhan