trigger:
  branches:
    include:
      - main

pool:
  name: 'Default'

stages:
- stage: BuildAndValidate
  displayName: 'Build & Package Stage'
  jobs:
  - job: ValidateHTML
    displayName: 'Validate and Archive Static Web Page'
    steps:
    - checkout: self

    - powershell: |
        Write-Host "Running automated CI build on self-hosted agent BALAJI-PC..."
        if (Test-Path "index.html") {
            Write-Host "SUCCESS: index.html is present!"
        } else {
            Write-Error "ERROR: index.html not found!"
            exit 1
        }
      displayName: 'Verify index.html exists'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
      displayName: 'Publish Website Artifact'
